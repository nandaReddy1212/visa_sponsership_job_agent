# Settings for ATS board discovery (Phase 2, logic 1–2)

discovery:
  top_n: 500                # top sponsors by sponsor_rank to search
  min_slug_len: 3                 # minimum length of slug to search
  generic_words:
    [SERVICES, SOLUTIONS, TECHNOLOGIES, TECHNOLOGY, GROUP, HOLDINGS,
     INTERNATIONAL, GLOBAL, SYSTEMS, AMERICA, USA, US, THE, AND, OF,
     INC, LLC, CORP, CORPORATION, CO, COMPANY, LTD, LP, LLP, UNITED, STATES]

# Boards whose slug can't be guessed from the company name.
# company_key comes from the sponsors table; keep the name as a comment.

overrides: []
# Boards whose slug can't be guessed from the company name.
# company_key comes from the sponsors table; keep the name as a comment.